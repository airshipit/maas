  group: maas.airshipit.org
  names:
    kind: MAASMachine
    listKind: MAASMachineList
    plural: maasmachines
    shortNames:
    - mm
    singular: maasmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.systemId
