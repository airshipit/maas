{{- if .Values.manifests.rack_service }}
{{- $envAll := . }}
{{- $rackSvc := .Values.conf.maas_boot_proxy.rack_service | default dict }}
{{- $rackPort := $rackSvc.port | default 5248 }}
---
# ClusterIP Service fronting the MAAS rack boot server (:5248). The rack runs
# as a hostNetwork StatefulSet, so the Service endpoints are the rack host IPs;
# kube-proxy load-balances across them and tracks pod migration. The boot proxy
# uses this as its stable upstream instead of hard-coded rack IPs. It also
# serves as the StatefulSet's governing Service (serviceName: maas-rack).
apiVersion: v1
kind: Service
metadata:
  name: {{ $rackSvc.name | default "maas-rack" }}
  labels:
{{ tuple $envAll "maas" "rack" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  ports:
    - name: rack-boot
      port: {{ $rackPort }}
      targetPort: {{ $rackPort }}
      protocol: TCP
  selector:
{{ tuple $envAll "maas" "rack" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
