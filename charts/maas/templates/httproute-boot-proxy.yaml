{{- if and .Values.manifests.maas_boot_proxy .Values.manifests.httproute_boot_proxy .Values.conf.maas_boot_proxy.enabled .Values.network.boot_proxy.httproute.public }}
{{- $path := .Values.endpoints.maas_boot_proxy.path.default | default "/boot" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-boot-proxy
  labels:
    app: maas-boot-proxy
{{- if .Values.network.boot_proxy.httproute.annotations }}
  annotations:
{{ toYaml .Values.network.boot_proxy.httproute.annotations | indent 4 }}
{{- end }}
spec:
  parentRefs:
{{ toYaml (list .Values.network.boot_proxy.httproute.parentRef) | indent 4 }}
{{- if .Values.endpoints.maas_boot_proxy.host_fqdn_override.public }}
  hostnames:
  - {{ .Values.endpoints.maas_boot_proxy.host_fqdn_override.public | quote }}
{{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ $path | quote }}
    filters:
      # Strip the /boot prefix so the proxy (and the rack behind it) sees
      # /ipxe.cfg-<mac>, /images/..., /iso/...
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
    backendRefs:
    - kind: Service
      name: maas-boot-proxy
      port: {{ tuple "maas_boot_proxy" "internal" "http" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- end }}
