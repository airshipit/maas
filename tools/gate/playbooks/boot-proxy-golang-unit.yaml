- hosts: primary
  roles:
    - role: ensure-go
      vars:
        go_version: "1.27.0"
  tasks:
    - name: Check formatting, vet and unit test the maas-boot-proxy
      shell: |
        set -xe
        export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:${PATH}"
        go version
        unformatted="$(gofmt -l .)"
        if [ -n "${unformatted}" ]; then
          echo "gofmt needed for:"
          echo "${unformatted}"
          exit 1
        fi
        go vet ./...
        go test -race -cover ./...
        # go.mod must not need changes (the module is stdlib only).
        go mod tidy
        git diff --exit-code -- go.mod go.sum
      args:
        chdir: "{{ zuul.project.src_dir }}/images/maas-boot-proxy"
        executable: /bin/bash
