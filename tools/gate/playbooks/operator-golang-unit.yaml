- hosts: primary
  roles:
    - role: ensure-go
      vars:
        go_version: "1.27.0"
  tasks:
    - name: Generate, vet, build and unit test the MaaS operator
      shell: |
        set -xe
        export PATH="/usr/local/go/bin:$(go env GOPATH)/bin:${PATH}"
        make manifests
        make go-build
        make go-test
      args:
        chdir: "{{ zuul.project.src_dir }}"
        executable: /bin/bash

    - name: Fail if generated or formatted files are out of date
      shell: |
        set -xe
        test -z "$(git status --porcelain)"
      args:
        chdir: "{{ zuul.project.src_dir }}"
        executable: /bin/bash
